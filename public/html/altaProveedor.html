<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Alta de Proveedores</title>
    <style>

    </style>
</head>

<body>

    <form id="formProveedores">
        <h1>Alta de Proveedores</h1>
        <p>Estatus</p>
        <select name="estatusProveedor" id="estatusProveedor">
            <option value="" disabled selected>Selecione un estatus</option>
            <option value="alta">Alta</option>
            <option value="baja">Baja</option>
        </select>
        <p>NickName</p>
        <input type="text" id="nickName" placeholder="NickName">
        <p>Razon Social</p>
        <input type="text" id="razonSocial" placeholder="Razon Social">
        <p>RFC</p>
        <input type="text" id="rfc" placeholder="RFC">
        <p>Domicilio Fiscal</p>
        <input type="text" id="domicilioFiscal" placeholder="Domicilio Fiscal">
        <p>Ciudad</p>
        <input type="text" id="ciudad" placeholder="Ciudad">
        <p>C.P.</p>
        <input type="text" id="cp" placeholder="C.P.">
        <p>Correo</p>
        <input type="text" id="correo" placeholder="Correo">
        <p>Cuenta</p>
        <input type="text" id="cuenta" placeholder="Cuenta">
        <p>CLABE</p>
        <input type="text" id="clabe" placeholder="CLABE">
        <br>

        <button id="btnGuardar">Guardar</button>
    </form>
    <!--<script src="scriptForm.js"></script>-->
    <script src="../scripts/scriptProveedor.js"></script>
</body>

</html>
