<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alta Personal</title>
        <link rel="stylesheet" href="">
    </head>

    <body>
        <header></header>
        <div>
            <h2>Registro de Personal</h2>
        </div>
        <!--<form id="Rpersonal">-->
        <form id="formPersonal">
            <div>
                <select id="estatusPersonal" name="estatus">
                    <option value="" disabled selected>Selecione una opcion</option>
                    <option value="alta">Alta</option>
                    <option value="baja">Baja</option>
                </select>
            </div>
            <div>
                <label>Nombre</label>
                <br>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div>
                <label>Apellido Paterno</label>
                <br>
                <input type="text" id="aPaterno" name="aPaterno" required>
            </div>
            <div>
                <label>Apellido Materno</label>
                <br>
                <input type="text" id="aMaterno" name="aMaterno" required>
            </div>
            <div>
                <label>CURP</label>
                <br>
                <input type="text" id="p_curp" name="p_curp" required>
            </div>
            <div>
                <label for="">Ciudad</label>
                <br>
                <input type="text" id="p_ciudad" name="p_ciudad" required>
            </div>
            <div>
                <label for="">Estado</label>
                <br>
                <input type="text" id="p_estado" name="p_estado">
            </div>
            <div>
                <label for="">Edad</label>
                <br>
                <input type="text" name="p_edad" id="p_edad">
            </div>
            <div>
                <br>
                <button type="submit">Guardar</button>
            </div>
        </form>

        <!--<script src="scriptForm.js"></script>-->
        <script src="../scripts/scriptPersonal.js"></script>
    </body>
</html>
