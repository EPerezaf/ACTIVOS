    <form id="formConceptoActivos">

            <select id="estatusConceptoActivos" name="estatusConceptoActivos" required>

        </div>
        <br>
        <div>
            <textarea id="conceptoActivos" name="conceptoActivos" placeholder="Descripcion de concepto Activo" required></textarea>
        </div>
        <div>
            <button type="submit" id="btnGuardar">Agregar</button>
