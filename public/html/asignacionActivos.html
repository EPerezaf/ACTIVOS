<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Asignacion de Activos</title>
        <link rel="stylesheet" href="">
        <style>
            .btn-remove{
                background: red;
                color: white;
            }

            .modal{
                display: none;
                position: relative;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgb(0, 0, 0, 0.5);
            }

            .modla-content{
                background-color: white;
                margin: 5% auto;
                padding: 20%;
                border-radius: 8px;
                width: 80%;
                max-width: 600px;
                max-height: 80vh;
                overflow-y: auto;
            }

            .close{
                color: #aaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
                cursor: pointer;
            }

            .close:hover{
                color: black;
            }

            .search-section{
                margin-bottom: 15px;
            }

            .search-section input {
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
            }

            .results-container {
                border: 1px solid #ddd;
                max-height: 200px;
                overflow-y: auto;
                margin-bottom: 15px;
            }
        </style>
    </head>
    <body>
        <header></header>

        <h2>Asignacion de Activos</h2>
        <div>
            <select name="estatusAsignacion" id="estatusAsignacion">
                <option value="" disabled selected>Selecciona un estatus</option>
                <option value="alta">Alta</option>
                <option value="baja">Baja</option>
            </select>
        </div>

        <textarea name="descripcionAsignacion" id="descripcionAsignacion" 
        placeholder="Escribe los comentarios o descripcion para la asignacion..."></textarea>

        <div>
            <h1>Seleccion de Personal</h1>
            <button id="abrirBusquedaPersonal" class="">Abrir Busqueda de Personal</button>
            <div id="contenedorPersonal"></div>
        </div>

        <div>
            <h1>Seleccion de Activo</h1>
            <button id="abrirBusquedaActivo">Abrir busqueda de Activos</button>
            <div id="contenedorActivo"></div>
        </div>

        <!--MODAL PARA PERSONAL-->
        <div id="modalPersonal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Busqueda de personal</h2>

                <div class="search-section">
                    <h3>Buscar Usuario</h3>
                    <input type="text" id="buscarPersonal" placeholder="Busca al usuario por Nombre o Apellidos...">
                    <div id="resultadoPersonal" class="results-container"></div>
                </div>
                <button id="cerrarPersonal">Cerrar</button>
            </div>
        </div>

        <!--MODAL PARA ACTIVOS-->
        <div id="modalActivo" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Busqueda de Activos</h2>

                <div class="search-section">
                    <h3>Buscar Concepto Activo</h3>
                    <input type="text" id="buscarActivo" placeholder="Buscar por Concepto de Activo">
                    <div id="resultadoActivo" class="results-container"></div>
                </div>
                <button id="cerrarActivo">Cerrar</button>
            </div>
        </div>

        
    </body>

</html>
