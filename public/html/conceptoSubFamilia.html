            max-width: 800px;

<body>

    <div class="container">
        <h1>Alta Sub Familia</h1>
        <h2>Sub Familia Concepto</h2>
        <form id="formSubFamilia">
            <div class="select-flotante">
                <div class="select-wrapper">
                    <select name="estatus" id="estatus">
                        <option name="" disabeld selected>Seleccione un opcion</option>
                        <option value="alta">Alta</option>
                        <option value="baja">Baja</option>
                    </select>
                    <label for="estatus">Estatus del Concepto</label>
                </div>
            </div>
            <div class="select-flotante">
                <div class="select-wrapper">
                    <select name="listaFamilia" id="listaFamilia" required>
                        <option name="" disabled selected>Seleccione una Familia</option>
                    </select>
                    <label for="listaFamilia">Concepto Familia</label>
                </div>
            </div>
            <div class="textarea-flotante">

            </div>
            <button id="btnGuardar" type="submit" class="btnGuardar">Guardar</button>
        </form>
    </div>

    <h2>Sub Familia Activos</h2>

    <br>

    <form id="formSubFamilia">
        <label for="listaFamilia">Familia</label>
        <br>
        <div>
            <select id="estatus" name="estatus" required>
                <option name="" disabled selected>Seleccione opcion</option>
                <option name="alta">Alta</option>
                <option name="baja">Baja</option>

            </select>
        </div>
        <select id="listaFamilia" required>
            <option value="" disabled selected>Selecciona una opcion</option>
        </select>
        
        <div>
            <textarea id="conceptoSubFamilia" name="conceptosubFamilia" placeholder="Escribe la subfamilia" required></textarea>
        </div>
        <button type="submit" id="btnGuardar">Enviar</button>


    </form>
