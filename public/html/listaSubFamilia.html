<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta>
        <title>Lista de Sub Familias</title>

        <style>
            body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .solicitud {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .solicitud h2 {
            margin-top: 0;
        }

        .section {
            margin-bottom: 10px;
        }

        ul {
            padding-left: 20px;
        }

        /*ESTILO PARA EL MODAL*/
        .fila {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .fila input[readonly] {
            background: #f0f0f0;
            border: 1px solid #ccc;
        }

        .btn-add,
        .btn-remove {
            cursor: pointer;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
        }

        .btn-add {
            background: green;
            color: white;
        }

        .btn-remove {
            background: red;
            color: white;
        }

        /*MODAL O VENTANA EMERGENTE*/
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .search-section {
            margin-bottom: 15px;
        }

        .search-section input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        .results-container {
            border: 1px solid #ddd;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cancelado {
  opacity: 0.6;
  background-color: #f8d7da;
  border: 1px solid #f5c2c7;
}

.cancelado h2, 
.cancelado p {
  color: #842029;
}

        </style>
    </head>
    <body>
        <h1>Lista de Sub Familias</h1>
        <div id="contenedorSubFamilia">
            <p>Cargando Listado...</p>
        </div>

        <script src="../scripts/scriptListaSubFamilia.js"></script>
    </body>
</html>
