<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Compras</title>
    <link rel="stylesheet" href="">
    <style>
        .fila {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .fila input[readonly] {
            background: #f0f0f0;
            border: 1px solid #ccc;
        }

        .btn-add,
        .btn-remove {
            cursor: pointer;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
        }

        .btn-add {
            background: green;
            color: white;
        }

        .btn-remove {
            background: red;
            color: white;
        }

        /*MODAL O VENTANA EMERGENTE*/
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .search-section {
            margin-bottom: 15px;
        }

        .search-section input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        .results-container {
            border: 1px solid #ddd;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <header></header>
    <h1>Solicitud De compras</h1>

    <textarea placeholder="Descripcion de solicitud de Compra" id="descripcionConceptoCompras"></textarea>

    <h2>Selección de personal</h2>
    <div id="contenedorPersonal"></div>
     <!-- Botón para abrir el modal de búsqueda -->
    <button id="abrirBusqueda" class="btn-add">Abrir Búsqueda</button>

    
    <h2>Selección de Concepto Gasto</h2>
    <button id="abrirConceptoCompra" class="btn-add">Abrir Busqueda</button>
    <div id="contenedorConceptoCompra"></div>
    <BR></BR>

    <button id="guardarBtn">Guardar</button>

    <!-- Modal para búsquedas -->
    <div id="modalBusqueda" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Búsqueda de Información</h2>

            <!-- Búsqueda de Personal -->
            <div class="search-section">
                <h3>Buscar Personal</h3>
                <input type="text" id="buscarPersonalModal" placeholder="Buscar por nombre o apellidos">
                <div id="resultadosBusquedaModal" class="results-container"></div>
            </div>
            <button id="cerrarModal">Cerrar</button>
        </div>
    </div>
    <div id="modalConceptoCompra" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Busqueda de Concepto Compra</h2>

            <!--Busqueda de Familia-->
            <div class="search-section">
                <h3>Buscar Concepto Compra</h3>
                <input type="text" id="buscarConceptoCompraModal" placeholder="Buscar Familia de activos">
                <div id="resultadosConceptoCompraModal" class="results-container"></div>
            </div>
            <button id="cerrarModalConceptoCompra">Cerrar</button>
        </div>
    </div>



    <script src="scriptForm.js"></script>


</body>

</html>
